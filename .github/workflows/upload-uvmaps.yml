name: Upload UV Maps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The uvmaps-* release to create (must be listed in Proteus/uvmaps/releases.json)"
        required: true
  push:
    tags:
      - 'uvmaps-*'

permissions:
  contents: write

jobs:
  upload:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      # Which files a tag publishes comes from Proteus/uvmaps/releases.json — the same table the client's pinned lists
      # are tested against — so the workflow names no file itself. A tag the table does not list is refused.
      # The tag reaches the script through the environment, never pasted into it, and must look like uvmaps-v<number>.
      - name: Resolve the tag's files
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $tag = if ($env:REF_TYPE -eq "tag") { $env:REF_NAME } else { $env:INPUT_TAG }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Error "No tag: push a uvmaps-* tag or give the dispatch a tag input."
            exit 1
          }
          if ($tag -cnotmatch '^uvmaps-v\d+\z') {
            Write-Error "Tag '$tag' is not of the form uvmaps-v<number>."
            exit 1
          }
          $table = Get-Content "Proteus\uvmaps\releases.json" -Raw | ConvertFrom-Json
          $names = $table.$tag
          if (-not $names) {
            Write-Error "Tag $tag is not listed in Proteus/uvmaps/releases.json."
            exit 1
          }
          $files = ($names | ForEach-Object { "Proteus\uvmaps\$_" }) -join ";"
          "TAG=$tag" | Out-File -Append $env:GITHUB_ENV
          "MAP_FILES=$files" | Out-File -Append $env:GITHUB_ENV

      # A real TIFF, not a Git LFS pointer ("version https://..."): the new maps are compressed, so their size no longer
      # tells the two apart, but a pointer never starts with a TIFF's magic.
      - name: Sanity-check the files are TIFFs
        shell: pwsh
        run: |
          foreach ($f in $env:MAP_FILES.Split(";")) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            $tiff = $bytes.Length -ge 4 -and (
              ($bytes[0] -eq 0x49 -and $bytes[1] -eq 0x49 -and $bytes[2] -eq 42 -and $bytes[3] -eq 0) -or
              ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x4D -and $bytes[2] -eq 0 -and $bytes[3] -eq 42))
            if (-not $tiff) {
              Write-Error "$f is not a TIFF ($($bytes.Length) bytes) — looks like an LFS pointer, not the real file. Aborting."
              exit 1
            }
            Write-Host "$f OK ($([math]::Round($bytes.Length/1MB, 1)) MB)"
          }

      # A tag's assets are IMMUTABLE. UVMapDownloadService pins a tag plus a SHA-256 per file, and the
      # download mirror caches by URL — so replacing the assets under an existing tag would serve stale
      # bytes from the edge and fail the client's checksum against whatever it eventually got. Revising a
      # map means a NEW tag (uvmaps-v3, ...), listed in releases.json, and the client's pinned list to match.
      - name: Refuse to overwrite an existing release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `gh release view` exits non-zero when the release is ABSENT — which is the normal, expected
          # case here. Actions prepends $ErrorActionPreference = 'Stop' to every pwsh step, and
          # PowerShell 7.4+ defaults $PSNativeCommandUseErrorActionPreference to $true, which promotes a
          # native non-zero exit into a TERMINATING error. Testing stdout truthiness would therefore
          # abort this step on exactly the path it exists to permit — a brand-new tag — and the release
          # would never be created. Opt out for this one command and read the exit code directly.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Error "Release $env:TAG already exists. Its assets are immutable because the client pins their checksums and the mirror caches them — push a new tag and list it in Proteus/uvmaps/releases.json instead."
            exit 1
          }

      - name: Create release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = $env:MAP_FILES.Split(";")
          gh release create $env:TAG `
            --title "UV Transfer Maps ($env:TAG)" `
            --notes "Static UV transfer map data files for Proteus. Downloaded automatically on first use — do not install manually." `
            @files

      # The client verifies every download against a pinned size and SHA-256, which is what catches a
      # THROTTLED transfer — a truncated body arrives with a 200 on it and no other check would notice.
      # Printed as ready-to-paste C# so updating the client is a copy, not a retyping exercise.
      - name: Emit checksums for the client
        shell: pwsh
        run: |
          $lines = @()
          $lines += "The client's pinned entries for ${env:TAG} (UVMapDownloadService):"
          $lines += '```csharp'
          foreach ($f in $env:MAP_FILES.Split(";")) {
            $i = Get-Item $f
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += '        new("{0}", "{1}", {2}L, "{3}"),' -f $i.Name, $env:TAG, $i.Length, $h
          }
          $lines += '```'
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
