name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud_dist
          "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud_dist" | Out-File -Append $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # The manifest's Changelog comes from the annotated tag's message, picked up as an MSBuild
      # property via the environment. It cannot come from the GitHub release body — that release is
      # created further down this job, long after the build. The tag type is asserted because a
      # lightweight tag carries no message and %(contents) silently falls through to the tagged
      # COMMIT's message, which would ship a random commit subject to every user as the changelog.
      - name: Build
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # actions/checkout fetches the tag's COMMIT sha and maps it straight onto refs/tags/<name>,
          # so every annotated tag arrives here flattened to a lightweight one and its message is
          # simply absent — fetch-depth: 0 does not help, because v4 also passes --no-tags. Without
          # this re-fetch the check below fails on correctly-annotated tags, and reading %(contents)
          # anyway would ship the tagged commit's subject to every user as the changelog.
          # --force is required: the lightweight tag already occupies the name.
          git fetch --force --tags origin
          if ((git cat-file -t $tag) -ne 'tag') {
            throw "$tag is a lightweight tag and carries no changelog. Re-tag it with: git tag -a $tag -F notes.md"
          }
          $env:Changelog = ((git tag -l --format='%(contents)' $tag) -join "`n").Trim()
          dotnet build Proteus/Proteus.csproj -c Release

      # The tag name does not set the version — Directory.Build.props stamps it as
      # yyMM.<git rev-list --count HEAD>, and the manifest read here is the only source of truth.
      # The tag is therefore free to disagree, and v2608.325.0.0 did: it sat twelve commits past
      # v2608.324.0.0 after a branch merge, so it shipped 2608.336.0.0 under a name claiming 325.
      # Nothing broke — the plugins repo reads the manifest too, so users got the right build from
      # a misleadingly named tag — but hand-incrementing drifts further from the real count every
      # time it happens. Fail here, before the release exists, rather than let a wrong name stick.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content "Proteus\bin\Release\win-x64\Proteus.json" | ConvertFrom-Json
          $version = $manifest.AssemblyVersion
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            throw "$tag does not match the built version $version. Delete the tag and re-tag with: git tag -a v$version -F notes.md"
          }
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT

      # Ship the package the Dalamud SDK already built, NOT a re-zip of the whole build output.
      # Zipping bin\Release\win-x64\* swallowed this very file, so every release carried a second,
      # complete copy of itself (and of DefaultEffects) nested inside — a ~61 MB download where
      # ~31 MB was the duplicate. Contents are otherwise identical, file for file.
      - name: Package
        shell: pwsh
        run: Copy-Item "Proteus\bin\Release\win-x64\Proteus\latest.zip" -Destination latest.zip

      # Dalamud re-downloads this zip on every update, for every user, and a testing tag goes out most
      # days — so anything large that sneaks into the build output is multiplied by all of that. It was
      # 31 MB (29 MB of it the starter effect art) until that art moved to its own release assets; the
      # UV maps have never belonged here. This guard exists because both regressions are invisible: the
      # plugin works perfectly either way, it just quietly costs everyone the bandwidth.
      - name: Guard the package size
        shell: pwsh
        run: |
          $maxBytes = 8MB
          $size = (Get-Item latest.zip).Length
          Write-Host "latest.zip is $([math]::Round($size/1MB, 2)) MB"
          if ($size -gt $maxBytes) {
            $big = (Get-ChildItem "Proteus\bin\Release\win-x64" -Recurse -File |
                    Sort-Object Length -Descending | Select-Object -First 10 |
                    ForEach-Object { "  {0,10:N0}  {1}" -f $_.Length, $_.FullName }) -join "`n"
            Write-Error "latest.zip is $([math]::Round($size/1MB, 2)) MB, over the $([math]::Round($maxBytes/1MB)) MB budget. Largest files in the build output:`n$big`n`nLarge assets belong in their own release (see .github/workflows/upload-effects.yml), not in the plugin zip."
            exit 1
          }

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify plugins repo
        shell: pwsh
        env:
          PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:PLUGINS_REPO_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $body = @{
            event_type     = "plugin-released"
            client_payload = @{
              plugin  = "Proteus"
              version = "${{ steps.version.outputs.version }}"
            }
          } | ConvertTo-Json

          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/solona-m/plugins/dispatches" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json"

