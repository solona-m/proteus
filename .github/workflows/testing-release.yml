name: Testing Release

on:
  push:
    tags:
      - 'testing-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile dalamud.zip
          Expand-Archive dalamud.zip -DestinationPath dalamud_dist
          "DALAMUD_HOME=$env:GITHUB_WORKSPACE\dalamud_dist" | Out-File -Append $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Same tag-message changelog as release.yml, but tolerant rather than fatal: testing tags are
      # disposable and usually lightweight, and a testing build with no changelog is fine. The tag
      # type is still checked — %(contents) on a lightweight tag returns the tagged commit's message,
      # not a changelog.
      - name: Build
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Restore the annotated tag object that actions/checkout flattens into a lightweight one —
          # see release.yml for the full explanation.
          git fetch --force --tags origin
          if ((git cat-file -t $tag) -eq 'tag') {
            $env:Changelog = ((git tag -l --format='%(contents)' $tag) -join "`n").Trim()
          } else {
            Write-Host "::notice::$tag is a lightweight tag - building without a changelog."
          }
          dotnet build Proteus/Proteus.csproj -c Release

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content "Proteus\bin\Release\win-x64\Proteus.json" | ConvertFrom-Json
          "version=$($manifest.AssemblyVersion)" | Out-File -Append $env:GITHUB_OUTPUT

      # Ship the SDK's own package rather than re-zipping the build output — see release.yml for why
      # (the re-zip nested a complete duplicate of the release inside itself).
      - name: Package
        shell: pwsh
        run: Copy-Item "Proteus\bin\Release\win-x64\Proteus\latest.zip" -Destination latest.zip

      # Testing tags go out most days and every tester re-downloads this, so the size budget matters
      # here even more than on a stable release. See release.yml for the reasoning.
      - name: Guard the package size
        shell: pwsh
        run: |
          $maxBytes = 8MB
          $size = (Get-Item latest.zip).Length
          Write-Host "latest.zip is $([math]::Round($size/1MB, 2)) MB"
          if ($size -gt $maxBytes) {
            $big = (Get-ChildItem "Proteus\bin\Release\win-x64" -Recurse -File |
                    Sort-Object Length -Descending | Select-Object -First 10 |
                    ForEach-Object { "  {0,10:N0}  {1}" -f $_.Length, $_.FullName }) -join "`n"
            Write-Error "latest.zip is $([math]::Round($size/1MB, 2)) MB, over the $([math]::Round($maxBytes/1MB)) MB budget. Largest files in the build output:`n$big`n`nLarge assets belong in their own release (see .github/workflows/upload-effects.yml), not in the plugin zip."
            exit 1
          }

      # Marked prerelease so it never becomes /releases/latest — the stable
      # DownloadLinkInstall keeps resolving to the last non-prerelease build.
      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify plugins repo
        shell: pwsh
        env:
          PLUGINS_REPO_TOKEN: ${{ secrets.PLUGINS_REPO_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:PLUGINS_REPO_TOKEN"
            Accept        = "application/vnd.github+json"
          }
          $body = @{
            event_type     = "plugin-released"
            client_payload = @{
              plugin  = "Proteus"
              version = "${{ steps.version.outputs.version }}"
              testing = $true
            }
          } | ConvertTo-Json

          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/solona-m/plugins/dispatches" `
            -Headers $headers `
            -Body $body `
            -ContentType "application/json"
