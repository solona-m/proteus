name: Upload Default Matcaps

# Publishes Proteus's own matcaps (Proteus/DefaultMatcaps) as pinned release assets. They never ride in the plugin
# zip: DefaultMatcapsDownloadService fetches them once per machine into the config directory, the first time the
# Studio's Matcaps pane is shown.
#
# Shipped as LOOSE files rather than one zip on purpose, as the effects are: zip bytes are not reproducible, so a
# checksum pinned in the client would break; loose files are uploaded verbatim and hash exactly.
#
# Tag pushes only (no manual dispatch): the files uploaded are then always the tagged commit's.
#
# ORDER MATTERS. Push the matcaps-* tag BEFORE the next v* or testing-* release. The client pins MatcapsTag, so a
# plugin whose tag has no release yet shows "could not be downloaded" in the Matcaps pane until the tag exists:
#   1. change the art  ->  2. paste the new checksums + bump MatcapsTag  ->  3. push matcaps-vN at that commit
#   ->  4. release the plugin

on:
  push:
    tags:
      - 'matcaps-*'

permissions:
  contents: write

jobs:
  upload:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag reaches the script through the environment, never pasted into it, and must look like matcaps-v<number>.
      # Same immutability contract as the effects: the client pins a tag plus a SHA-256 per file and the mirror caches
      # by URL, so revised art means a NEW tag and a matching MatcapsTag bump in the client.
      - name: Check the tag and refuse to overwrite an existing release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          if ($tag -cnotmatch '^matcaps-v\d+\z') {
            Write-Error "Tag '$tag' is not of the form matcaps-v<number>."
            exit 1
          }

          # `gh release view` exits non-zero when the release is ABSENT, the expected case; see upload-effects.yml for
          # why the native-command error preference is turned off for this one command.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0

          if ($exists) {
            Write-Error "Release $tag already exists. Its assets are immutable because the client pins their checksums and the mirror caches them — push a new tag (e.g. matcaps-v2) and bump MatcapsTag in DefaultMatcapsDownloadService instead."
            exit 1
          }
          "TAG=$tag" | Out-File -Append $env:GITHUB_ENV

      # Every file a real PNG, so nothing else (a pointer file, a stray document) is ever published.
      - name: Sanity-check the files are PNGs
        shell: pwsh
        run: |
          $files = Get-ChildItem "Proteus\DefaultMatcaps" -File
          if ($files.Count -eq 0) { Write-Error "No files in Proteus\DefaultMatcaps"; exit 1 }
          foreach ($f in $files) {
            $b = [System.IO.File]::ReadAllBytes($f.FullName)
            if ($b.Length -lt 8 -or $b[0] -ne 0x89 -or $b[1] -ne 0x50 -or $b[2] -ne 0x4E -or $b[3] -ne 0x47) {
              Write-Error "$($f.Name) is not a PNG."
              exit 1
            }
          }

      - name: Create release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem "Proteus\DefaultMatcaps" -File
          Write-Host "Uploading $($files.Count) file(s), $([math]::Round(($files | Measure-Object Length -Sum).Sum/1MB,1)) MB total"

          # GitHub rewrites spaces in release asset names: stage the uploads with spaces replaced by dots, the same
          # substitution DefaultMatcapsDownloadService.RemoteName makes. The files keep their own names on the user's disk.
          $stage = Join-Path $env:RUNNER_TEMP "matcaps"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($f in $files) {
            Copy-Item $f.FullName (Join-Path $stage ($f.Name -replace ' ', '.'))
          }

          # --latest=false: an asset release must never become the repo's "Latest" release.
          gh release create $env:TAG `
            --latest=false `
            --title "Default Matcaps ($env:TAG)" `
            --notes "Matcaps for the Studio's Matcaps tool. Downloaded automatically the first time the tool is opened — do not install manually." `
            @((Get-ChildItem $stage -File).FullName)

      - name: Emit checksums for the client
        shell: pwsh
        run: |
          # The LOCAL names (spaces intact): the client stores those and derives the dotted remote name via RemoteName().
          $lines = @()
          $lines += "Must equal DefaultMatcapsDownloadService.Matcaps, with MatcapsTag = ""$env:TAG"":"
          $lines += '```csharp'
          foreach ($i in (Get-ChildItem "Proteus\DefaultMatcaps" -File | Sort-Object Name)) {
            $h = (Get-FileHash $i.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += '        ("{0}", {1}L, "{2}"),' -f $i.Name, $i.Length, $h
          }
          $lines += '```'
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
