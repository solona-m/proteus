# Dependabot version updates. Every PR targets `test`, never `main` (the release branch).
#
# GitHub reads this file from the DEFAULT branch only, which is `main`: nothing here takes effect until
# `test` is next merged into `main`. After that merge, check Insights -> Dependency graph -> Dependabot
# that each ecosystem's update job succeeded.
#
# Dependabot PRs merge under Dependabot's own authorship. workflows/dependabot-automerge.yml builds and
# tests each one and merges it into test if it is a minor or patch update. Majors and submodule bumps
# stay open for a person: build those locally and try them in game before merging — a submodule bump can
# change the IPC API. Bump Plugin.BuildNumber for that local try only; don't commit it. A NuGet PR that
# leaves Proteus/packages.lock.json stale fails SupplyChainTests and is never merged: close it and make
# the bump by hand on a feature branch. Every merge on GitHub moves origin/test: pull before the next
# local merge into test.
#
# Security-update PRs (Settings -> Code security) stay off: GitHub always opens them against main.

version: 2
updates:
  - package-ecosystem: nuget
    # Each repo-owned project, listed explicitly: the solution also lists the submodule projects, and
    # omits Proteus.Tests and Proteus.Refit.
    directories:
      - "/Proteus"
      - "/Proteus.Refit"
      - "/Proteus.Tests"
      - "/XivLiveMesh"
    target-branch: "test"
    schedule:
      interval: weekly
    # A version is proposed only once it has been public for 3 days: most hijacked releases are pulled by then.
    cooldown:
      default-days: 3
    ignore:
      # The Dalamud SDK (global.json) is tied to DalamudApiLevel and is bumped by hand with the game;
      # the other two are injected by that SDK and versioned with it.
      - dependency-name: "Dalamud.NET.Sdk"
      - dependency-name: "DalamudPackager"
      - dependency-name: "DotNet.ReproducibleBuilds"
    groups:
      nuget-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directory: "/worker"
    target-branch: "test"
    schedule:
      interval: weekly
    # A version is proposed only once it has been public for 3 days: most hijacked releases are pulled by then.
    cooldown:
      default-days: 3
    # worker/ deliberately has no lockfile, so a PR that only raises a ^ floor changes nothing at deploy
    # time. increase-if-necessary proposes only versions outside the range, i.e. majors.
    versioning-strategy: increase-if-necessary
    groups:
      npm-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "test"
    schedule:
      interval: weekly
    # A version is proposed only once it has been public for 3 days: most hijacked releases are pulled by then.
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: gitsubmodule
    directory: "/"
    target-branch: "test"
    schedule:
      interval: weekly
    # A version is proposed only once it has been public for 3 days: most hijacked releases are pulled by then.
    cooldown:
      default-days: 3
    # Glamourer tracks its testing branch and each IPC bump needs checking in game: one open PR at a time.
    open-pull-requests-limit: 1
