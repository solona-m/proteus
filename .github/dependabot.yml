# Dependabot version updates. Every PR targets `test`, never `main` (the release branch).
#
# GitHub reads this file from the DEFAULT branch only, which is `main`: nothing here takes effect until
# `test` is next merged into `main`. After that merge, check Insights -> Dependency graph -> Dependabot
# that each ecosystem's update job succeeded.
#
# Dependabot PRs are reviewed and merged as they are, under Dependabot's own authorship. They get no CI
# build (test.yml runs on main only), so build a NuGet or submodule bump locally and try it in game
# before merging; a submodule bump can change the IPC API. A NuGet bump that leaves
# Proteus/packages.lock.json stale fails SupplyChainTests — rebuild and commit the lock file onto the
# PR's branch. Merging on GitHub moves origin/test: pull before the next local merge into test.
#
# Security-update PRs (Settings -> Code security) stay off: GitHub always opens them against main.

version: 2
updates:
  - package-ecosystem: nuget
    # Each repo-owned project, listed explicitly: the solution also lists the submodule projects, and
    # omits Proteus.Tests and Proteus.Refit.
    directories:
      - "/Proteus"
      - "/Proteus.Refit"
      - "/Proteus.Tests"
      - "/XivLiveMesh"
    target-branch: "test"
    schedule:
      interval: weekly
    ignore:
      # The Dalamud SDK (global.json) is tied to DalamudApiLevel and is bumped by hand with the game;
      # the other two are injected by that SDK and versioned with it.
      - dependency-name: "Dalamud.NET.Sdk"
      - dependency-name: "DalamudPackager"
      - dependency-name: "DotNet.ReproducibleBuilds"
    groups:
      nuget-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: npm
    directory: "/worker"
    target-branch: "test"
    schedule:
      interval: weekly
    # worker/ deliberately has no lockfile, so a PR that only raises a ^ floor changes nothing at deploy
    # time. increase-if-necessary proposes only versions outside the range, i.e. majors.
    versioning-strategy: increase-if-necessary
    groups:
      npm-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "test"
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: gitsubmodule
    directory: "/"
    target-branch: "test"
    schedule:
      interval: weekly
    # Glamourer tracks its testing branch and each IPC bump needs checking in game: one open PR at a time.
    open-pull-requests-limit: 1
